<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carta 💖</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="sakura-container"></div>
    
    <div id="envelope" onclick="openLetter()">
        <div class="flap"></div>
        <div class="seal">💛</div>
        <p>Para ti 💖</p>
    </div>

    <main id="letter" class="hidden">
        <h1 id="typed"></h1>
        <p>Escribe aquí tu carta de amor...</p>
    </main>

    <!-- Reproductor oficial de Spotify -->
    <div id="spotify">
        <iframe 
            style="border-radius:12px" 
            src="https://open.spotify.com/embed/track/5r5sF35TZ66zMyPfgMn8wj?utm_source=generator" 
            width="100%" 
            height="152" 
            frameBorder="0" 
            allowfullscreen="" 
            allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" 
            loading="lazy">
        </iframe>
    </div>

    <script src="script.js"></script>
    <script src="sakura.js"></script>
</body>
</html>
